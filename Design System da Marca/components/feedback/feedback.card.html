<link rel="stylesheet" href="../../styles.css">
<style>html,body{margin:0}body{background:#fff;padding:20px;box-sizing:border-box}</style>
<script type="importmap">{"imports":{"react":"https://esm.sh/react@18","react-dom/client":"https://esm.sh/react-dom@18/client"}}</script>
<div id="root"></div>
<script type="module">
import React from 'react'; import {createRoot} from 'react-dom/client';
import {Dialog} from './Dialog.jsx'; import {Toast} from './Toast.jsx'; import {Tooltip} from './Tooltip.jsx';
import {Button} from '../core/Button.jsx';
const h = React.createElement;
function Demo(){
  const [open,setOpen]=React.useState(false);
  return h('div',{style:{display:'flex',flexDirection:'column',gap:14,alignItems:'flex-start'}},
    h('div',{style:{display:'flex',gap:10,flexWrap:'wrap'}},
      h(Toast,{tone:'success',onClose:()=>{}},'Orçamento enviado!'),
      h(Toast,{tone:'danger'},'Item esgotado no CD Norte.')),
    h('div',{style:{display:'flex',gap:14,alignItems:'center'}},
      h(Button,{variant:'outline',onClick:()=>setOpen(true)},'Abrir dialog'),
      h(Tooltip,{label:'Entrega em até 24h'},
        h('span',{style:{font:'500 14px var(--font-body)',color:'var(--link)',borderBottom:'1px dashed var(--border-strong)',cursor:'help'}},'prazo de entrega'))),
    h(Dialog,{open,title:'Confirmar pedido',onClose:()=>setOpen(false),
      footer:[h(Button,{key:1,variant:'outline',size:'sm',onClick:()=>setOpen(false)},'Cancelar'),h(Button,{key:2,size:'sm',onClick:()=>setOpen(false)},'Confirmar')]},
      'Enviar o pedido de 12 sacos de cimento CP-II para o CD Norte?'));
}
createRoot(document.getElementById('root')).render(h(Demo));
</script>
